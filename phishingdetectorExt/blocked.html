<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚠️ Blocked</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:system-ui,sans-serif;background:linear-gradient(135deg,#1a1a2e,#16213e);min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px}
        .card{background:#fff;border-radius:16px;max-width:480px;width:100%;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.3)}
        .header{background:linear-gradient(135deg,#e74c3c,#c0392b);color:#fff;padding:30px;text-align:center}
        .header .icon{font-size:60px;margin-bottom:12px}
        .header h1{font-size:22px;margin-bottom:6px}
        .header p{opacity:.9;font-size:13px}
        .content{padding:24px}
        .alert{background:#fff3cd;border:1px solid #ffc107;border-radius:8px;padding:14px;margin-bottom:16px;font-size:13px;color:#856404}
        .url-box{background:#f8f9fa;border:1px solid #dee2e6;border-radius:8px;padding:12px;margin-bottom:16px;word-break:break-all;font-family:monospace;font-size:12px;color:#e74c3c}
        .conf{text-align:center;margin-bottom:20px}
        .conf-bar{height:8px;background:#e9ecef;border-radius:4px;overflow:hidden;margin-top:8px}
        .conf-fill{height:100%;background:linear-gradient(90deg,#f39c12,#e74c3c);border-radius:4px}
        .buttons{display:flex;gap:12px;flex-wrap:wrap}
        .btn{flex:1;min-width:100px;padding:12px;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;transition:.2s}
        .btn-safe{background:#27ae60;color:#fff}
        .btn-safe:hover{background:#219a52}
        .btn-trust{background:#3498db;color:#fff}
        .btn-trust:hover{background:#2980b9}
        .btn-danger{background:transparent;color:#e74c3c;border:2px solid #e74c3c}
        .btn-danger:hover{background:#e74c3c;color:#fff}
        .tips{margin-top:20px;padding-top:16px;border-top:1px solid #eee;font-size:12px;color:#666}
        .tips li{padding:4px 0;list-style:none}
        .tips li::before{content:"⚠️ ";margin-right:4px}
        .success{background:#d4edda;color:#155724;border:1px solid #c3e6cb}
    </style>
</head>
<body>
    <div class="card">
        <div class="header" id="header">
            <div class="icon">✋</div>
            <h1>Phishing Detected!</h1>
            <p>This website <b>may</b> be dangerous, proceed with caution!</p>
        </div>
        <div class="content">
            <div class="alert" id="alert"> This ML model detected this URL as a potential phishing attempt.</div>
            <div class="url-box" id="url">Loading...</div>
            <div class="conf">
                <b>Confidence: <span id="conf-val">0%</span></b>
                <div class="conf-bar"><div class="conf-fill" id="conf-bar"></div></div>
            </div>
            <div class="buttons" id="buttons">
                <button class="btn btn-safe" id="btn-back">← Go Back</button>
                <button class="btn btn-trust" id="btn-trust">✓ Trust Site</button>
                <button class="btn btn-danger" id="btn-continue">Continue</button>
            </div>
            <ul class="tips">
                <li>Don't enter passwords on suspicious sites</li>
                <li>Check the URL carefully</li>
                <li>When in doubt, navigate directly</li>
            </ul>
        </div>
    </div>
    <script src="blocked.js"></script>
</body>
</html>
